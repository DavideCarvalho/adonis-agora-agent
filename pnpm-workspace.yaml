packages:
  - "packages/*"
# pnpm >= 10 nao roda build script de dependencia sem permissao explicita, e em CI ele
# ERRA (ERR_PNPM_IGNORED_BUILDS) em vez de so avisar -- o release morre no
# `pnpm install --frozen-lockfile` antes de chegar no changesets. Todos estes ja rodavam
# sob o pnpm 9 (biome/swc/esbuild/better-sqlite3/sharp compilam ou baixam binario), entao
# liberar preserva o comportamento; nao e permissao nova.
allowBuilds:
  '@biomejs/biome': true
  '@swc/core': true
  better-sqlite3: true
  # testcontainers' optional native SSH speedups and a postinstall it does not need; it runs
  # without them (as in nestjs-agent).
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false
minimumReleaseAgeExclude:
  - '@dudousxd/nestjs-agent-core@0.26.0 || 0.33.0 || 0.34.0 || 0.36.0'
  - '@dudousxd/nestjs-agent-react@0.28.0 || 0.31.0'
  # Earlier releases, installed under aliases so a spec can park a run on the code that is in
  # production and replay it on this one (test/detached-upgrade-replay.spec.ts,
  # test/personas-upgrade-replay.spec.ts).
  - '@adonis-agora/agent@0.56.0 || 0.58.0 || 0.59.0'
  - '@adonis-agora/durable@0.43.1'
