name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, 'feat/**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The schema-provisioning tests need real Postgres locks (test/schema-provisioning-postgres.spec.ts),
    # and the Lucid store suites run on it too.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENT_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # Under CI the Lucid store suites run on SQLite, this job's Postgres service and a MySQL 8.4
      # container testcontainers starts (packages/adonis/test/global-setup-real-db.ts). Required:
      # without Docker the run fails rather than skipping MySQL.
      - run: pnpm test

      - run: pnpm build
