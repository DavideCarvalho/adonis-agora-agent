name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, 'feat/**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

  # The suite runs on every Node line we support (the range `engines.node` promises): the lines Node
  # itself still maintains that AdonisJS 7 also accepts (it requires >=24).
  # Lint, typecheck and build stay on the single pinned version above: only the test run is multiplied.
  # The real-database suites ride along on every line — one Postgres service and one MySQL container
  # per leg, running in parallel, is cheap next to what a driver regression on a newer Node would cost.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    name: test (node ${{ matrix.node }})
    # The schema-provisioning tests need real Postgres locks (test/schema-provisioning-postgres.spec.ts),
    # and the Lucid store suites run on it too.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENT_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Under CI the Lucid store suites run on SQLite, this job's Postgres service and a MySQL 8.4
      # container testcontainers starts (packages/adonis/test/global-setup-real-db.ts). Required:
      # without Docker the run fails rather than skipping MySQL.
      - run: pnpm test
